name: Build

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
            name: branchpad-macos-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release -p branchpad --target ${{ matrix.target }}

      # macOS: dựng Branchpad.app (có icon), ký ad-hoc, nén bằng ditto để giữ quyền chạy
      - name: Package macOS app
        run: |
          APP=dist/Branchpad.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/${{ matrix.target }}/release/branchpad "$APP/Contents/MacOS/branchpad"
          chmod +x "$APP/Contents/MacOS/branchpad"
          cp assets/icon/icon.icns "$APP/Contents/Resources/icon.icns"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Branchpad</string>
            <key>CFBundleDisplayName</key><string>Branchpad</string>
            <key>CFBundleIdentifier</key><string>vn.kaseru.branchpad</string>
            <key>CFBundleExecutable</key><string>branchpad</string>
            <key>CFBundleIconFile</key><string>icon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.1.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>CFBundleDocumentTypes</key>
            <array><dict>
              <key>CFBundleTypeName</key><string>Document</string>
              <key>CFBundleTypeRole</key><string>Editor</string>
              <key>LSHandlerRank</key><string>Alternate</string>
              <key>LSItemContentTypes</key>
              <array>
                <string>public.data</string>
                <string>public.content</string>
                <string>public.folder</string>
                <string>public.plain-text</string>
                <string>public.source-code</string>
              </array>
            </dict></array>
          </dict></plist>
          PLIST
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" dist/Branchpad-macos.zip
      - name: Upload macOS
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/Branchpad-macos.zip
