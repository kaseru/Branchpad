[workspace]
resolver = "2"
members = ["crates/git", "crates/core", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
branchpad-git = { path = "crates/git" }
branchpad-core = { path = "crates/core" }
# UI: GPUI (Zed) + gpui-component (Longbridge). Ghim phiên bản chính xác.
gpui = "=0.2.2"
gpui-component = { version = "=0.4.0", features = ["tree-sitter-languages"] }
gpui-component-assets = "=0.4.0"
anyhow = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
notify = { version = "8", default-features = false }

similar = "2"
trash = "5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2
