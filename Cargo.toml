[workspace]
resolver = "2"
members = ["crates/git", "crates/core", "crates/agent", "crates/app"]
# Bản gpui-component vá riêng (chọn chữ trong TextView), xem vendor/gpui-component/BRANCHPAD.md
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
branchpad-git = { path = "crates/git" }
branchpad-core = { path = "crates/core" }
branchpad-agent = { path = "crates/agent" }
# UI: GPUI (Zed) + gpui-component (Longbridge). Ghim phiên bản chính xác.
gpui = "=0.2.2"
gpui-component = { version = "=0.4.0", features = ["tree-sitter-languages"] }
gpui-component-assets = "=0.4.0"
anyhow = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
notify = { version = "8", default-features = false }

similar = "2"
trash = "5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2

# gpui-component 0.4.0 vá: TextView bấm đúp chọn từ, bấm ba lần chọn đoạn, kéo chọn từ lề ngoài chữ.
# gpui 0.2.2 vá: xuống dòng không cắt giữa chữ tiếng Việt (xem vendor/gpui/BRANCHPAD.md).
[patch.crates-io]
gpui-component = { path = "vendor/gpui-component" }
gpui = { path = "vendor/gpui" }
