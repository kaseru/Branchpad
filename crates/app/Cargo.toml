[package]
name = "branchpad"
description = "Branchpad – git như Fork, soạn file như VSCode, cho macOS"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "branchpad"
path = "src/main.rs"

[dependencies]
branchpad-git.workspace = true
branchpad-core.workspace = true
branchpad-agent.workspace = true
gpui.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
anyhow.workspace = true
futures.workspace = true
serde_json.workspace = true

# macOS: bật/tắt kéo cửa sổ khi chuột ở trên tab repo (gpui đã kéo theo hai crate này).
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
raw-window-handle = "0.6"

# `cargo bundle --release` (cargo-bundle) tạo Branchpad.app
[package.metadata.bundle]
name = "Branchpad"
identifier = "vn.kaseru.branchpad"
category = "public.app-category.developer-tools"
osx_minimum_system_version = "12.0"
short_description = "Git client và trình soạn file nhẹ cho macOS"
icon = ["../../assets/icon/icon.icns"]

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
